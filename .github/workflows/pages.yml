name: Deploy Blitz site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # The committed dist is what the site and the drop-in ship.
      - run: git diff --exit-code -- dist
      # Landing page (/), the game (/play/) and the drop-in (/blitz.js).
      - run: npm run site:build
        env:
          # Custom domain (defaults here; repo variables override): SITE_URL=https://battlefieldblitz.fzlt.games and SITE_BASE=/
          SITE_URL: ${{ vars.SITE_URL || 'https://battlefieldblitz.fzlt.games' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}
          # GA4 + PostHog behind the consent banner (site/src/lib/analytics). Public ids, so repository
          # Variables, not Secrets. Unset = off: the build ships no analytics code.
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
