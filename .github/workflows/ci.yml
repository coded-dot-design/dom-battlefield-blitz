name: Blitz checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # dist/ is what DOM Battlefield ships: it must be the build of this commit.
      - run: git diff --exit-code -- dist
      - run: npm run size
      - run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length) { console.error('Blitz ships no runtime dependencies'); process.exit(1) }"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # Same seed, same match: no Math.random in play (Fizlet multiplayer needs this).
      - run: npm run test:replay
      # The site (landing, /play/, /blitz.js), built for github.io; pages.yml deploys it.
      - run: npm run site:build
      - run: npm run test:site
  tag-version:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          tag="v$(node -p 'require("./package.json").version')"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then exit 0; fi
          git tag "$tag"
          git push origin "$tag"
