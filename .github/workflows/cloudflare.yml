# Cloudflare Pages deploy for dom-battlefield-blitz: PR -> preview, main -> staging, promote -> production.
# Generated by the Fizlet factory: `fe deploy dom-battlefield-blitz --write` (its template factory/templates/deploy/cloudflare.yml).
# Do not hand-edit: change the template or the flags and run `fe deploy` again; `fe deploy --check` fails on drift.
# fe-deploy: id=dom-battlefield-blitz build=npm run site:build dist=artifacts/pages
#
# Owner adds (names only): secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID; variable CF_PREVIEW_ACCESS=on once
# Cloudflare Access covers the previews; GitHub environment `production`; Pages project battlefield-blitz with production branch `production`.
# Every deploy job skips with a notice (and succeeds) until the secrets exist. The Cloudflare secrets reach only
# the gate and wrangler steps (never npm ci or the build). PR previews (same-repo PRs only) deploy as `pr-<n>-<branch>`
# and are single-player: the room server allows only the staging and production hosts. Promote runs only from main.
name: cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "The main SHA to promote to production (every check on it must have succeeded)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: battlefield-blitz
  STAGING_HOST: battlefieldblitz-staging.fzlt.games
  PRODUCTION_HOST: battlefieldblitz.fzlt.games
  WRANGLER: wrangler@4.150.0

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CF_PREVIEW_ACCESS: ${{ vars.CF_PREVIEW_ACCESS }}
      HEAD_REF: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=preview skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set"; echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$CF_PREVIEW_ACCESS" != "on" ]; then
            echo "::notice title=preview skipped::set the variable CF_PREVIEW_ACCESS=on once Cloudflare Access covers *.$PROJECT.pages.dev"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.go == 'yes'
        run: npm ci
      - if: steps.gate.outputs.go == 'yes'
        env:
          PUBLIC_DEPLOY_TARGET: staging
          SITE_URL: https://${{ env.STAGING_HOST }}
          SITE_BASE: /
          PUBLIC_ROOMS_URL: ${{ vars.ROOMS_URL }}
        run: npm run site:build
      - if: steps.gate.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Always prefixed: a PR can never deploy as the `production` or `staging` alias.
          branch="pr-$PR_NUMBER-$(printf '%s' "$HEAD_REF" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9-' '-' | cut -c1-20)"
          branch="${branch%-}"
          npx --yes "$WRANGLER" pages deploy "artifacts/pages" --project-name="$PROJECT" --branch="$branch" --commit-hash="${{ github.event.pull_request.head.sha }}" --commit-dirty=true
          echo "::notice title=preview::https://$branch.$PROJECT.pages.dev"

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=staging skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.go == 'yes'
        run: npm ci
      - if: steps.gate.outputs.go == 'yes'
        env:
          PUBLIC_DEPLOY_TARGET: staging
          SITE_URL: https://${{ env.STAGING_HOST }}
          SITE_BASE: /
          PUBLIC_ROOMS_URL: ${{ vars.ROOMS_URL }}
        run: npm run site:build
      - if: steps.gate.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy "artifacts/pages" --project-name="$PROJECT" --branch=staging --commit-hash="$GITHUB_SHA" --commit-dirty=true
          echo "::notice title=staging::https://$STAGING_HOST/ (alias https://staging.$PROJECT.pages.dev)"

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://battlefieldblitz.fzlt.games/
    permissions:
      contents: write
      checks: read
      statuses: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha }}
    steps:
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=promote skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; production not moved"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - if: steps.gate.outputs.go == 'yes'
        name: refuse unless the SHA is on main and every check on it succeeded (earlier promote runs aside)
        run: |
          set -euo pipefail
          case "$SHA" in *[!0-9a-f]*|"") echo "::error::sha must be a full 40-hex commit"; exit 1;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::sha must be a full 40-hex commit"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          own=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .check_suite_id)
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --jq ".check_runs[] | select(.check_suite.id != $own and .name != \"promote\") | \"\(.status) \(.conclusion) \(.name)\"")
          [ -n "$runs" ] || { echo "::error::no checks ran on $SHA"; exit 1; }
          bad=$(printf '%s\n' "$runs" | awk '$1 != "completed" || ($2 != "success" && $2 != "skipped")' || true)
          if [ -n "$bad" ]; then echo "::error::not every check on $SHA succeeded:"; printf '%s\n' "$bad"; exit 1; fi
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '[.total_count, .state] | @tsv')
          case "$state" in 0*|*success) ;; *) echo "::error::commit statuses on $SHA: $state"; exit 1;; esac
          echo "every check on $SHA succeeded:"; printf '%s\n' "$runs"
      - name: fast-forward production to the SHA
        if: steps.gate.outputs.go == 'yes'
        run: |
          git fetch origin production || true
          if git rev-parse -q --verify origin/production >/dev/null; then
            git merge-base --is-ancestor origin/production "$SHA" || { echo "::error::production is not an ancestor of $SHA: not a fast-forward"; exit 1; }
          fi
          git push origin "$SHA:refs/heads/production"
      - if: steps.gate.outputs.go == 'yes'
        run: git checkout --detach "$SHA"
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.go == 'yes'
        run: npm ci
      - if: steps.gate.outputs.go == 'yes'
        env:
          PUBLIC_DEPLOY_TARGET: production
          SITE_URL: https://${{ env.PRODUCTION_HOST }}
          SITE_BASE: /
          PUBLIC_ROOMS_URL: ${{ vars.ROOMS_URL }}
          # Analytics behind the consent banner, production only (repo variables; unset = none ships).
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
        run: npm run site:build
      - if: steps.gate.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy "artifacts/pages" --project-name="$PROJECT" --branch=production --commit-hash="$SHA" --commit-dirty=true
          echo "::notice title=production::https://$PRODUCTION_HOST/ is $SHA"
